<!doctype html>
<html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TAU Voice | Hamdi Photography</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d17;color:#effaff;font:16px system-ui}main{width:min(680px,94%);margin:5vh auto;padding:clamp(16px,5vw,40px);background:#111a29;border:1px solid #263d51;border-radius:28px}header,form,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}.core{width:105px;aspect-ratio:1;margin:26px auto;border-radius:50%;background:radial-gradient(circle at 45% 40%,#d5fffa,#41dbd1 18%,#173e62 52%,#0b1423 69%);box-shadow:0 0 30px #21cec05c}.core.active{animation:pulse 1s infinite alternate}@keyframes pulse{to{box-shadow:0 0 55px #21cecf}}@media(prefers-reduced-motion:reduce){.core.active{animation:none}}button,select,input{font:inherit;padding:10px 13px;border:1px solid #456073;border-radius:10px;background:#172639;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #73f7e8}#mic,form button{background:#79f5e5;color:#08282c}#status{text-align:center;color:#9af5e9;min-height:1.6em}#log{height:205px;overflow:auto;padding:0 12px;background:#0b1220;border-radius:12px;margin:14px 0}#log p{overflow-wrap:anywhere}input{flex:1;min-width:130px}small{display:block;color:#b9cad9;margin-top:14px}

body{min-height:100svh;background:radial-gradient(circle at 50% 0,#133249,transparent 48%),#080d17}
main{box-shadow:0 30px 100px #0007}
.core{position:relative;border:1px solid #58ecde88;box-shadow:0 0 34px #21cec05c,inset 0 0 22px #6cfff53b}
.core:before,.core:after{content:"";position:absolute;inset:-13px;border:1px solid #41dbd155;border-radius:50%;pointer-events:none}
.core:after{inset:-25px;border-color:#41dbd127}
.actions{justify-content:center}.actions button{min-height:48px}
.tau-links{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:16px 0}
.tau-links a,.tau-links button{font:inherit;text-align:center;border:1px solid #408b91;border-radius:11px;background:#19394c;color:#c7fff5;text-decoration:none;min-height:46px;padding:10px 14px}
#tau-live{background:#13505a;color:#efffff;font-weight:700}
#tau-secure-note{padding:10px;border:1px solid #486077;border-radius:10px;color:#d5e7fb;font-size:.9rem}
@media(max-width:480px){main{margin:2vh auto;padding:18px}#log{height:30svh}.actions button{flex:1}form button{min-height:48px}}
</style>
<main><header><h1 dir="ltr">TAU Voice</h1><select id="language" aria-label="اللغة / Dil"><option value="ar">العربية</option><option value="tr">Türkçe</option></select></header>
<div class="core" aria-hidden="true"></div><p id="status" role="status"></p>
<div class="actions"><button id="mic" type="button"></button><button id="mute" type="button"></button><button id="clear" type="button"></button></div>
<div id="log" role="log"></div>
<form><input id="input" maxlength="400" autocomplete="off"><button id="send"></button></form>
<div class="tau-links"><button id="tau-welcome" type="button">🔊 اسمع الترحيب</button><a id="tau-live" href="https://hamdi--photography.hamdihajiali3.workers.dev/hamdi-ai/assistant" target="_blank" rel="noopener noreferrer">🔒 المساعد الذكي المباشر</a><a id="tau-home" href="./">↩ الموقع</a></div>
<p id="tau-secure-note" role="status" hidden></p><small id="hint"></small>
</main>
<script>
const byId = id => document.getElementById(id);
const words = {
 ar:{locale:'ar-SA',ready:'جاهز',mic:'تحدث',stop:'أوقف الاستماع',mute:'كتم الصوت',unmute:'تشغيل الصوت',clear:'امسح المحادثة',send:'إرسال',input:'اكتب أمرًا',hint:'جرّب: كم الساعة؟ • شو التاريخ؟ • احفظ ملاحظة عندي امتحان • اقرأ الملاحظة • احذف الملاحظة',welcome:'مرحبًا، أنا تاو. كيف أساعدك؟',listen:'أستمع إليك…',speak:'أتحدث…',unsupported:'جرّب Chrome للاستماع، أو استخدم الكتابة.',error:'تعذر الاستماع. تحقق من إذن الميكروفون والاتصال، أو استخدم الكتابة.',noVoice:'صوت العربية غير متاح على هذا الجهاز.',empty:'لا توجد ملاحظة محفوظة.',saved:'حفظت الملاحظة.',deleted:'حذفت الملاحظة.',storage:'تعذر الوصول إلى الملاحظات على هذا الجهاز.',unknown:'أستطيع إخبارك بالوقت والتاريخ وحفظ ملاحظة وقراءتها. قل: شو بتقدر تعمل؟',help:'اسألني عن الوقت أو التاريخ، أو قل: احفظ ملاحظة، وبعدها قل نص الملاحظة. لقراءتها قل: اقرأ الملاحظة.',you:'أنت'},
 tr:{locale:'tr-TR',ready:'Hazır',mic:'Konuş',stop:'Dinlemeyi durdur',mute:'Sesi kapat',unmute:'Sesi aç',clear:'Sohbeti temizle',send:'Gönder',input:'Bir komut yaz',hint:'Dene: Saat kaç? • Bugün ayın kaçı? • Not al yarın sınavım var • Notu oku • Notu sil',welcome:'Merhaba, ben Tau. Nasıl yardımcı olabilirim?',listen:'Seni dinliyorum…',speak:'Konuşuyorum…',unsupported:'Dinleme için Chrome’u dene veya komutunu yaz.',error:'Dinleme başarısız. Mikrofon iznini ve bağlantını kontrol et veya komutunu yaz.',noVoice:'Bu cihazda Türkçe ses bulunamadı.',empty:'Kayıtlı not yok.',saved:'Notu kaydettim.',deleted:'Notu sildim.',storage:'Bu cihazdaki notlara erişilemedi.',unknown:'Saati ve tarihi söyleyebilirim. Ayrıca not alıp okuyabilirim. “Ne yapabilirsin?” diye sor.',help:'Saat veya tarihi sor. Not kaydetmek için “not al” deyip metnini söyle. Okumak için “notu oku” de.',you:'Sen'}
};
let language = 'ar', muted = false, recognition, utterance;
const synth = window.speechSynthesis;
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const t = () => words[language];
function status(message, active = false) {
  byId('status').textContent = message;
  document.querySelector('.core').classList.toggle('active', active);
}
function append(label, value) {
  const line = document.createElement('p');
  line.dir = 'auto';
  line.textContent = label + ' · ' + value;
  byId('log').append(line);
  byId('log').scrollTop = byId('log').scrollHeight;
}
function stopVoice() {
  utterance = undefined;
  synth?.cancel();
}
function answer(value, aloud = true) {
  append('TAU', value);
  if (!aloud || muted || !synth) return;
  const voices = synth.getVoices();
  const voice = voices.find(item => item.lang.toLowerCase().startsWith(language));
  if (!voice && voices.length) { status(t().noVoice); return; }
  stopVoice();
  const speech = new SpeechSynthesisUtterance(value);
  speech.lang = t().locale;
  if (voice) speech.voice = voice;
  speech.rate = 0.9;
  utterance = speech;
  status(t().speak, true);
  speech.onend = speech.onerror = event => {
    if (utterance !== speech) return;
    utterance = undefined;
    status(event.type === 'error' ? t().noVoice : t().ready);
  };
  synth.speak(speech);
}
function reply(raw) {
  const command = raw.toLocaleLowerCase(t().locale).replace(/[؟?!.,،]/g,'').trim();
  const note = raw.match(/^(?:احفظ\s+ملاحظة|سجل\s+ملاحظة|not\s+al)\s*[:：،,-]?\s+(.+)$/iu);
  const key = 'tau-note-' + language;
  try {
    if (note) { localStorage.setItem(key, note[1].trim()); return t().saved; }
    if (/^(?:اقرأ الملاحظة|اقرا الملاحظة|notu oku)$/.test(command)) return localStorage.getItem(key) || t().empty;
    if (/^(?:احذف الملاحظة|notu sil)$/.test(command)) { localStorage.removeItem(key); return t().deleted; }
  } catch { return t().storage; }
  if (/^(?:كم الساعة|كم الساعه|شو الساعة|شو الساعه|الساعة كم|saat kaç)$/.test(command)) return new Intl.DateTimeFormat(t().locale,{timeStyle:'short'}).format(new Date());
  if (/^(?:شو التاريخ|ما التاريخ|ما هو التاريخ|التاريخ|tarih ne|bugün ayın kaçı)$/.test(command)) return new Intl.DateTimeFormat(t().locale,{dateStyle:'full',calendar:'gregory'}).format(new Date());
  if (/^(?:مرحبا|مرحباً|أهلا|اهلا|merhaba|selam)$/.test(command)) return t().welcome;
  if (/^(?:شو بتقدر تعمل|مساعدة|ماذا تستطيع أن تفعل|yardım|ne yapabilirsin|احفظ ملاحظة|not al)$/.test(command)) return t().help;
  if (/(?:خدمات|تصوير|صور|fotoğraf|çekim|hizmet)/iu.test(command)) return language === 'tr' ? 'Hamdi Photography: portre, mezuniyet, kimlik fotoğrafı, kuaför çekimi ve renk düzenleme. Randevu için siteden hizmet seç.' : 'بستوديو Hamdi Photography في تصوير شخصي وتخرّج وصور هويات وتصوير حلاقة وتعديل ألوان. للحجز اختَر خدمة بالموقع.';
  if (/(?:احجز|حجز|موعد|randevu|rezervasyon)/iu.test(command)) return language === 'tr' ? 'Randevu isteği için sitedeki hizmet kartlarından birini seç. Kesin randevu stüdyo onayından sonra.' : 'لتطلب موعد، ارجع للموقع واختَر الخدمة. موعدك بيتأكد بعد التواصل مع الاستوديو.';
  return t().unknown;
}
function submit(value) {
  const text = value.trim();
  if (!text) return;
  append(t().you, text);
  answer(reply(text));
}
function stopListening() {
  const previous = recognition;
  recognition = undefined;
  previous?.abort();
  byId('mic').textContent = t().mic;
}
byId('mic').onclick = () => {
  if (recognition) { stopListening(); status(t().ready); return; }
  if (!Recognition) { status(t().unsupported); return; }
  stopVoice();
  const session = new Recognition();
  recognition = session;
  session.lang = t().locale;
  let result, failed = false;
  session.onresult = event => { result = event.results[0][0].transcript; };
  session.onerror = () => {
    if (recognition !== session) return;
    failed = true;
    status(t().error);
  };
  session.onend = () => {
    if (recognition !== session) return;
    recognition = undefined;
    byId('mic').textContent = t().mic;
    if (failed) return;
    status(t().ready);
    if (result) submit(result);
  };
  try {
    session.start();
    byId('mic').textContent = t().stop;
    status(t().listen, true);
  } catch {
    recognition = undefined;
    status(t().error);
  }
};
document.querySelector('form').onsubmit = event => {
  event.preventDefault();
  stopListening();
  status(t().ready);
  submit(byId('input').value);
  byId('input').value = '';
};
byId('mute').onclick = () => {
  muted = !muted;
  byId('mute').textContent = muted ? t().unmute : t().mute;
  if (muted && utterance) { stopVoice(); status(t().ready); }
};
byId('clear').onclick = () => {
  stopListening();
  stopVoice();
  byId('log').replaceChildren();
  status(t().ready);
};
function renderLanguage() {
  document.documentElement.lang = language;
  document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';
  for (const key of ['mic','clear','send','hint']) byId(key).textContent = t()[key];
  byId('mute').textContent = muted ? t().unmute : t().mute;
  byId('input').placeholder = t().input;
  byId('input').setAttribute('aria-label', t().input);
  status(t().ready);
  answer(t().welcome, false);
}
byId('language').onchange = event => {
  stopListening();
  stopVoice();
  language = event.target.value;
  renderLanguage();
};
synth?.getVoices();
renderLanguage();
const requestedLanguage=new URLSearchParams(location.search).get('lang');
if(['ar','tr'].includes(requestedLanguage)){language=requestedLanguage;byId('language').value=language;renderLanguage();}
byId('tau-welcome').onclick=()=>answer(t().welcome,true);
function updateTauLinks(){
  const tr=language==='tr';
  byId('tau-welcome').textContent=tr?'🔊 Karşılamayı dinle':'🔊 اسمع الترحيب';
  byId('tau-live').textContent=tr?'🔒 Canlı yapay zekâ asistanı':'🔒 المساعد الذكي المباشر';
  byId('tau-live').href='https://hamdi--photography.hamdihajiali3.workers.dev/hamdi-ai/assistant?lang='+language;
  byId('tau-home').textContent=tr?'↩ Ana sayfa':'↩ الموقع';
  byId('tau-home').href=tr?'./tr/':'./';
  const note=byId('tau-secure-note');
  note.hidden=window.isSecureContext;
  note.textContent=tr?'Mikrofon için HTTPS gereklidir. Güvenli bağlantıda canlı asistanı açabilirsiniz.':'الميكروفون يحتاج HTTPS. افتح المساعد الذكي بالرابط الآمن؛ الكتابة والرد الصوتي متاحان هنا بعد الضغط.';
}
const languageHandler=byId('language').onchange;
byId('language').onchange=e=>{languageHandler(e);updateTauLinks();};
updateTauLinks();
</script></html>
