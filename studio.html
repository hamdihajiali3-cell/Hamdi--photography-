<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>استوديو التعديل الذكي | Hamdi Photography"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=DM+Sans:wght@600;700&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--gold:#d8b675}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#382718,#080808 55%);color:#f5f0e7;font-family:Cairo,Arial,sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}.top{padding:22px 6%;display:flex;justify-content:space-between;border-bottom:1px solid #ffffff22}.brand{font:700 15px 'DM Sans';letter-spacing:2px;color:var(--gold)}main{width:min(1050px,92%);margin:55px auto}.eyebrow{text-align:center;color:var(--gold);font:600 12px 'DM Sans';letter-spacing:2px}h1{text-align:center;font-size:clamp(32px,6vw,56px);margin:12px 0}.intro{text-align:center;color:#aaa398;line-height:1.9;max-width:650px;margin:0 auto 34px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:linear-gradient(145deg,#191713,#0e0e0d);border:1px solid #d8b67540;border-radius:20px;padding:22px;min-width:0}h2{font-size:18px;margin:0 0 15px}.drop,.result{min-height:290px;border:1px dashed #d8b67580;border-radius:15px;display:grid;place-items:center;text-align:center;padding:15px;overflow:hidden;background:#0005}.drop{cursor:pointer}.drop img,.result img{max-width:100%;max-height:400px;object-fit:contain;border-radius:10px}.drop input{display:none}.gold{color:var(--gold)}.muted{color:#aaa398;font-size:12px}textarea{width:100%;min-height:140px;margin-top:15px;background:#090909;border:1px solid #ffffff30;border-radius:12px;color:white;padding:14px;font:14px/1.8 Cairo;resize:vertical}button{width:100%;margin-top:15px;padding:14px;border:0;border-radius:99px;background:linear-gradient(120deg,#f0d69e,#b88b4b);color:#17120a;font:700 15px Cairo;cursor:pointer}button:disabled{opacity:.55}.status{text-align:center;color:var(--gold);font-size:13px;min-height:26px;margin-top:10px}.download{display:none;color:var(--gold);text-align:center;text-decoration:underline;margin-top:12px}footer{text-align:center;color:#777;padding:30px}@media(max-width:720px){.grid{grid-template-columns:1fr}main{margin:35px auto}}
</style></head><body><header class="top"><a class="brand" href="./">HAMDI PHOTOGRAPHY</a><a href="./">العودة للموقع ↗</a></header><main><p class="eyebrow">AI PHOTO LAB · HAMDI PHOTOGRAPHY</p><h1>استوديو التعديل الذكي</h1><p class="intro">ارفع صورتك واكتب التعديل المطلوب بالعربية أو التركية أو الإنجليزية. اطلب إضاءة سينمائية أو خلفية جديدة أو تحسينًا احترافيًا، مع الحفاظ على ملامح الشخص قدر الإمكان.</p><div class="grid"><section class="panel"><h2>١. الصورة والتعليمات</h2><label class="drop" for="photo"><span id="preview"><b class="gold">اضغط لاختيار صورة</b><br><span class="muted">JPG أو PNG أو WEBP · حتى 12 MB</span></span><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><textarea id="prompt" maxlength="1800" placeholder="مثال: حوّلها إلى بورتريه سينمائي بخلفية داكنة وإضاءة جانبية ناعمة، وحافظ على ملامح الوجه كما هي..."></textarea><button id="go">ابدأ التعديل الذكي</button><div class="status" id="status"></div></section><section class="panel"><h2>٢. النتيجة المعدّلة</h2><div class="result" id="result"><span class="muted">ستظهر النتيجة هنا</span></div><a class="download" id="save" download="hamdi-edited-photo.png">تنزيل الصورة</a></section></div></main><footer>© Hamdi Photography · Gaziantep, Türkiye</footer><script>
const input=document.querySelector('#photo'),preview=document.querySelector('#preview'),result=document.querySelector('#result'),status=document.querySelector('#status'),go=document.querySelector('#go'),save=document.querySelector('#save');let file=null;
input.addEventListener('change',()=>{file=input.files[0]||null;save.style.display='none';if(!file)return;if(file.size>12*1024*1024){status.textContent='حجم الصورة أكبر من 12 MB';file=null;input.value='';return}const img=document.createElement('img');img.src=URL.createObjectURL(file);img.alt='الصورة الأصلية';preview.replaceChildren(img)});
go.addEventListener('click',async()=>{const prompt=document.querySelector('#prompt').value.trim();if(!file){status.textContent='اختر صورة أولاً';return}if(!prompt){status.textContent='اكتب وصف التعديل المطلوب';return}go.disabled=true;go.textContent='جارٍ التعديل…';status.textContent='قد تستغرق العملية بعض الوقت';result.textContent='نعالج الصورة الآن…';try{const form=new FormData();form.append('image',file,file.name);form.append('prompt',prompt);const res=await fetch('/api/studio/edit',{method:'POST',body:form});const data=await res.json();if(!res.ok)throw Error(data.message||(data.error==='studio_not_configured'?'واجهة الاستوديو جاهزة، لكن مفتاح خدمة الصور لم يُضف إلى Cloudflare بعد.':data.error||'تعذر التعديل'));const img=document.createElement('img');img.src=data.image;img.alt='الصورة المعدّلة';result.replaceChildren(img);save.href=data.image;save.style.display='block';status.textContent='اكتمل التعديل'}catch(e){result.textContent='لم تكتمل المعالجة';status.textContent=e.message}finally{go.disabled=false;go.textContent='ابدأ التعديل الذكي'}});
</script></body></html>
