name: Prepare verified RAW engine files

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-libraw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify the pinned LibRaw-Wasm files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw-engine
          revision=909d3ff518958d4c28e64d0293be00fc3ab33685
          base="https://raw.githubusercontent.com/ybouane/LibRaw-Wasm/$revision"
          declare -A expected=(
            [index.js]=34694c3d5d40feb22504c72aef949350cbce5a87
            [libraw.js]=a823f9d325f75bc6cb7d086992e6d4619acfedb7
            [libraw.wasm]=7841eadeb82f384e44f518f93993ac2c5cbc82c7
            [worker.js]=5727dfcb7cbbf026288a848cbbca4414c0beddae
          )
          for name in index.js libraw.js libraw.wasm worker.js; do
            curl --fail --proto '=https' --retry 3 "$base/dist/$name" -o "raw-engine/$name"
            if [[ "$(git hash-object "raw-engine/$name")" != "${expected[$name]}" ]]; then
              echo "Checksum mismatch for $name" >&2
              exit 1
            fi
          done
          printf 'Upstream: LibRaw-Wasm %s (ISC package license)\n' "$revision" > raw-engine/UPSTREAM-LICENSE.txt
      - name: Save verified files for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-raw-engine
          path: raw-engine/
          if-no-files-found: error
