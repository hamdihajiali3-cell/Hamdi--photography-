<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>تجربة الصوت الطبيعي — Hamdi Photography</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e9eee5;color:#193f34;font:17px/1.9 Tahoma,Arial,sans-serif}main{width:min(36rem,90%);padding:2rem;box-sizing:border-box;background:#fffaf1;border:1px solid #ccd5c1;border-radius:1rem}button{font:inherit;min-height:48px;padding:.5rem 1rem;margin:.3rem;background:#193f34;color:white;border:0;border-radius:.5rem;cursor:pointer}button:disabled{opacity:.5}audio{width:100%;margin:1rem 0}pre{font:inherit;white-space:pre-wrap}small{display:block}a{color:inherit}</style><main><p>HAMDI PHOTOGRAPHY</p><h1>تجربة الصوت الطبيعي</h1><p>نحضّر أسئلة الحجز العامة بصوت أنثوي طبيعي. لا تُفتح أي ميكروفونات، ولا نرسل بيانات زبائن.</p><button id="sample">اسمع عينة السؤال</button><button id="prepare">تحضير كل الأسئلة</button><button id="stop" hidden>إيقاف التحضير</button><audio controls id="preview"></audio><pre role="status" id="status">جاهز للتجربة.</pre><small>اللغة العربية والتركية — 16 عبارة ثابتة. تُحفظ المقاطع ليُعاد تشغيلها دون توليد عند كل طلب.</small><a href="./">العودة إلى المساعد</a></main><script type="module">
const sample=document.querySelector('#sample'),prepare=document.querySelector('#prepare'),stop=document.querySelector('#stop'),status=document.querySelector('#status'),audio=document.querySelector('audio');
const keys=['service','name','channel','phone','email','when','review','sent'];let cancelled=false,objectUrl='';
const url=(lang,key)=>'/api/order/prompt/aoede-v1/'+lang+'/'+key+'.wav';
async function load(lang,key){const r=await fetch(url(lang,key));if(!r.ok){let e;try{e=await r.json()}catch{}throw new Error(e?.error||'voice-unavailable')}const b=await r.blob();if(b.type!=='audio/wav')throw Error('audio-invalid');return b;}
sample.onclick=async()=>{sample.disabled=true;status.textContent='جاري تجهيز العينة…';try{const b=await load('ar','service');if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(b);audio.src=objectUrl;audio.dataset.state='ready';await audio.play();status.textContent='اسمع العينة من المشغّل.';}catch(e){status.textContent='تعذرت العينة: '+e.message;}finally{sample.disabled=false;}};
audio.onended=()=>{audio.dataset.state='ended';status.textContent='اكتمل تشغيل العينة.'};audio.onplaying=()=>audio.dataset.state='playing';
stop.onclick=()=>{cancelled=true;stop.disabled=true;};
prepare.onclick=async()=>{prepare.disabled=true;sample.disabled=true;stop.hidden=false;stop.disabled=false;cancelled=false;let count=0;try{for(const lang of ['ar','tr'])for(const key of keys){if(cancelled)throw Error('stopped');status.textContent='تحضير '+lang+' / '+key+' — '+count+'/16';await load(lang,key);count++;document.documentElement.dataset.prepared=String(count);if(count<16)await new Promise(r=>setTimeout(r,20000));}status.textContent='اكتمل تحضير الأسئلة العربية والتركية: 16/16';document.documentElement.dataset.preparation='complete';}catch(e){status.textContent='توقف التحضير عند '+count+'/16: '+e.message;document.documentElement.dataset.preparation='stopped';}finally{prepare.disabled=false;sample.disabled=false;stop.hidden=true;}};
</script></html>
